<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cluck Life - Prototype v2</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0f0f1a; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; }
h1 { color: #ff6b6b; margin: 10px 0; }
#ui { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1100px; }
.panel { background: #1a1a2e; padding: 12px; border-radius: 8px; min-width: 220px; }
canvas { border: 2px solid #333; background: #87CEEB; }
button { background: #e94560; color: white; border: none; padding: 8px 12px; margin: 4px; border-radius: 5px; cursor: pointer; font-weight: bold; }
button:hover { background: #ff6b6b; }
button:disabled { background: #444; }
.stat-row { display: flex; justify-content: space-between; margin: 4px 0; }
.bar { height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin: 2px 0; }
.bar-fill { height: 100%; background: #4CAF50; }
#log { height: 80px; overflow-y: auto; background: #000; padding: 5px; font-size: 12px; border-radius: 4px; }
</style>
</head>
<body>
<h1>🐔 CLUCK LIFE</h1>
<p>Raise • Train • Allocate • Fight • Bet</p>

<div id="ui">
  <div class="panel">
    <h3>Chicken Stats</h3>
    <div class="stat-row"><span>Level</span> <b id="level">1</b></div>
    <div class="stat-row"><span>XP</span> <b id="xp">0</b>/<span id="xpNeed">100</span></div>
    <div class="bar"><div class="bar-fill" id="xpBar" style="width:0%"></div></div>
    <div class="stat-row"><span>Coins</span> <b id="coins">100</b></div>
    <div class="stat-row"><span>Energy</span> <b id="energy">100</b>/100</div>
    <div class="bar"><div class="bar-fill" id="energyBar" style="width:100%;background:#2196F3"></div></div>
    <div class="stat-row"><span>HP</span> <b id="hp">100</b></div>
    <div class="stat-row"><span>Attack</span> <b id="atk">10</b></div>
    <div class="stat-row"><span>Defense</span> <b id="def">5</b></div>
    <div class="stat-row"><span>Speed</span> <b id="spd">5</b></div>
    <div class="stat-row"><span>Points</span> <b id="points">0</b></div>
    <button onclick="addPoint('atk')">+ Atk</button>
    <button onclick="addPoint('def')">+ Def</button>
    <button onclick="addPoint('spd')">+ Spd</button>
  </div>

  <div class="panel">
    <canvas id="arena" width="320" height="200"></canvas>
    <div id="log"></div>
  </div>

  <div class="panel">
    <h3>Actions</h3>
    <button onclick="feed()">Feed (15 coins)</button><br>
    <button onclick="startTrain('peck')">Train Peck</button>
    <button onclick="startTrain('run')">Train Run</button>
    <button onclick="startTrain('dodge')">Train Dodge</button><br>
    <hr>
    <button onclick="startFight()">Fight AI (bet)</button>
    <input type="number" id="betAmount" value="20" min="5" style="width:70px; margin:5px;"> coins
    <div id="status"></div>
  </div>
</div>

<script>
let chicken = {
  level: 1, xp: 0, xpNeed: 100, coins: 100, energy: 100,
  hp: 100, atk: 10, def: 5, spd: 5, points: 0
};

const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');

function log(msg) {
  logEl.innerHTML += msg + '<br>';
  logEl.scrollTop = logEl.scrollHeight;
}

function updateUI() {
  document.getElementById('level').textContent = chicken.level;
  document.getElementById('xp').textContent = chicken.xp;
  document.getElementById('xpNeed').textContent = chicken.xpNeed;
  document.getElementById('coins').textContent = chicken.coins;
  document.getElementById('energy').textContent = chicken.energy;
  document.getElementById('hp').textContent = chicken.hp;
  document.getElementById('atk').textContent = chicken.atk.toFixed(1);
  document.getElementById('def').textContent = chicken.def.toFixed(1);
  document.getElementById('spd').textContent = chicken.spd.toFixed(1);
  document.getElementById('points').textContent = chicken.points;
  document.getElementById('xpBar').style.width = (chicken.xp / chicken.xpNeed * 100) + '%';
  document.getElementById('energyBar').style.width = chicken.energy + '%';
}

function gainXP(n) {
  chicken.xp += n;
  while (chicken.xp >= chicken.xpNeed) {
    chicken.xp -= chicken.xpNeed;
    chicken.level++;
    chicken.points += 3;
    chicken.hp += 15;
    chicken.xpNeed = Math.floor(chicken.xpNeed * 1.35);
    log(`Level up! Now level ${chicken.level}`);
  }
  updateUI();
}

function addPoint(stat) {
  if (chicken.points <= 0) return;
  chicken.points--;
  chicken[stat] += 1;
  updateUI();
}

function feed() {
  if (chicken.coins < 15 || chicken.energy >= 100) {
    document.getElementById('status').textContent = 'Can\'t feed right now';
    return;
  }
  chicken.coins -= 15;
  chicken.energy = Math.min(100, chicken.energy + 50);
  updateUI();
  log('Fed chicken. Energy restored.');
}

function startTrain(type) {
  if (chicken.energy < 12) {
    document.getElementById('status').textContent = 'Need more energy!';
    return;
  }
  chicken.energy -= 12;
  let bonus = 0.8 + Math.random() * 0.6;
  if (type === 'peck') chicken.atk += bonus;
  if (type === 'run') chicken.spd += bonus;
  if (type === 'dodge') chicken.def += bonus;
  gainXP(20 + Math.floor(Math.random()*15));
  log(`Trained ${type}!`);
  updateUI();
}

function drawChicken(x, y, color, facing) {
  ctx.save();
  ctx.translate(x, y);
  if (facing < 0) ctx.scale(-1, 1);
  // body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, 28, 22, 0, 0, Math.PI*2);
  ctx.fill();
  // comb
  ctx.fillStyle = 'red';
  ctx.beginPath();
  ctx.moveTo(-8, -18); ctx.lineTo(0, -32); ctx.lineTo(8, -18); ctx.fill();
  // beak
  ctx.fillStyle = 'orange';
  ctx.beginPath();
  ctx.moveTo(22, -4); ctx.lineTo(34, 0); ctx.lineTo(22, 4); ctx.fill();
  // eye
  ctx.fillStyle = 'black';
  ctx.beginPath(); ctx.arc(12, -6, 3, 0, Math.PI*2); ctx.fill();
  // legs
  ctx.strokeStyle = 'yellow'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-8, 18); ctx.lineTo(-8, 32); ctx.moveTo(8, 18); ctx.lineTo(8, 32); ctx.stroke();
  ctx.restore();
}

function startFight() {
  const bet = parseInt(document.getElementById('betAmount').value) || 20;
  if (chicken.coins < bet || chicken.energy < 20) {
    document.getElementById('status').textContent = 'Not enough coins or energy';
    return;
  }
  chicken.coins -= bet;
  chicken.energy -= 20;

  const ai = {
    hp: 90 + chicken.level * 10,
    atk: 9 + chicken.level * 1.5,
    def: 5 + chicken.level * 0.6,
    spd: 5 + chicken.level * 0.5
  };

  let pHp = chicken.hp, aHp = ai.hp;
  log('--- Fight Start ---');
  let turns = 0;
  while (pHp > 0 && aHp > 0 && turns < 30) {
    turns++;
    // player
    let dmg = Math.max(1, (chicken.atk - ai.def * 0.4) * (0.8 + Math.random()*0.5));
    aHp -= dmg;
    log(`You hit for ${dmg.toFixed(0)}`);
    if (aHp <= 0) break;
    // ai
    dmg = Math.max(1, (ai.atk - chicken.def * 0.4) * (0.8 + Math.random()*0.5));
    pHp -= dmg;
    log(`AI hits for ${dmg.toFixed(0)}`);
  }

  const won = pHp > 0;
  if (won) {
    const reward = Math.floor(bet * 1.8) + 25;
    chicken.coins += reward;
    gainXP(40 + chicken.level * 8);
    log(`WIN! +${reward} coins`);
    document.getElementById('status').textContent = `Victory! +${reward} coins`;
  } else {
    log('Lost the fight...');
    document.getElementById('status').textContent = 'Defeated. Train more!';
  }
  updateUI();

  // simple visual
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawChicken(80, 100, '#fff', 1);
  drawChicken(240, 100, '#c85a17', -1);
  ctx.fillStyle = '#000';
  ctx.font = '16px sans-serif';
  ctx.fillText(won ? 'VICTORY!' : 'DEFEAT', 120, 40);
}

updateUI();
log('Welcome to Cluck Life. Train, feed, and fight!');
</script>
</body>
</html>
